<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TaskFlow — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #0a0a0f;
    --card: #13131a;
    --border: #2a2a3a;
    --accent: #7c6ff7;
    --accent2: #f97316;
    --text: #e8e8f0;
    --muted: #6b6b80;
    --success: #22c55e;
    --error: #ef4444;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .bg-grid {
    position: fixed; inset: 0; z-index: 0;
    background-image: linear-gradient(var(--border) 1px, transparent 1px),
                      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 40px 40px;
    opacity: 0.3;
  }
  .glow {
    position: fixed;
    width: 500px; height: 500px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(124,111,247,0.15) 0%, transparent 70%);
    top: -100px; left: -100px;
    z-index: 0;
  }
  .glow2 {
    position: fixed;
    width: 400px; height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(249,115,22,0.1) 0%, transparent 70%);
    bottom: -100px; right: -100px;
    z-index: 0;
  }
  .card {
    position: relative; z-index: 1;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 48px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 25px 80px rgba(0,0,0,0.5);
    animation: fadeUp 0.5s ease;
  }
  @keyframes fadeUp {
    from { opacity:0; transform: translateY(20px); }
    to { opacity:1; transform: translateY(0); }
  }
  .logo {
    font-family: 'Syne', sans-serif;
    font-size: 28px;
    font-weight: 800;
    margin-bottom: 8px;
  }
  .logo span { color: var(--accent); }
  .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 36px; }
  .form-group { margin-bottom: 20px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 8px; font-weight: 500; letter-spacing: 0.5px; }
  input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 13px 16px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    transition: border-color 0.2s;
    outline: none;
  }
  input:focus { border-color: var(--accent); }
  .btn {
    width: 100%;
    padding: 14px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    font-family: 'Syne', sans-serif;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    margin-top: 8px;
  }
  .btn:hover { opacity: 0.9; transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .switch { text-align: center; margin-top: 24px; font-size: 14px; color: var(--muted); }
  .switch a { color: var(--accent); text-decoration: none; font-weight: 500; }
  .alert {
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 20px;
    display: none;
  }
  .alert.error { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; }
  .alert.success { background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.3); color: #86efac; }
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="glow"></div>
<div class="glow2"></div>
<div class="card">
  <div class="logo">Task<span>Flow</span></div>
  <p class="subtitle">Sign in to manage your tasks</p>
  <div class="alert" id="alert"></div>
  <div class="form-group">
    <label>EMAIL ADDRESS</label>
    <input type="email" id="email" placeholder="you@example.com"/>
  </div>
  <div class="form-group">
    <label>PASSWORD</label>
    <input type="password" id="password" placeholder="••••••••"/>
  </div>
  <button class="btn" onclick="login()">Sign In</button>
  <div class="switch">Don't have an account? <a href="/register">Register here</a></div>
</div>
<script>
async function login() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const alert = document.getElementById('alert');
  if (!email || !password) { showAlert('Please fill all fields', 'error'); return; }
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({email, password})
    });
    const data = await res.json();
    if (res.ok) {
      showAlert('Login successful! Redirecting...', 'success');
      setTimeout(() => window.location.href = '/dashboard', 800);
    } else {
      showAlert(data.error || 'Login failed', 'error');
    }
  } catch(e) { showAlert('Connection error', 'error'); }
}
function showAlert(msg, type) {
  const el = document.getElementById('alert');
  el.textContent = msg;
  el.className = `alert ${type}`;
  el.style.display = 'block';
}
document.addEventListener('keydown', e => { if(e.key === 'Enter') login(); });
</script>
</body>
</html>
